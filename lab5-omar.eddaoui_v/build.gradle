plugins {
    id 'java'
    id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'eu.telecomnancy.oop-lab5'
version = '1.0-SNAPSHOT'

java {
    // toolchain {
    //     languageVersion = JavaLanguageVersion.of(17)
    // }
    if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
        throw new GradleException("JDK 17 or newer is required")
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            include '**/*.java'
        }
    }
    test {
        java {
            srcDirs = ['test']
            include '**/*.java'
            excludes = [
// Comment tests source filename when the corresponding code is ready to be tested
                //'diary/AttributableTest.java',
                //'diary/TimestampableTest.java',
                //'diary/AbstractEntryDefTest.java',
                //'diary/AbstractEntryTest.java',
                //'diary/KeywordableTest.java',
                //'diary/AbstractMediaDefTest.java',
                //'diary/AbstractMediaTest.java',
                //'diary/ArticleDefTest.java',
                //'diary/ArticleTest.java',
                //'diary/PhotoDefTest.java',
                //'diary/PhotoTest.java',
                //'diary/VideoDefTest.java',
                //'diary/VideoTest.java',
                //'diary/DiaryServiceTest.java',
                //'diary/DiaryServiceImplDefTest.java',
                //'diary/DiaryServiceImplTest.java'
            ]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    failFast = false
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

testlogger {
    theme = 'mocha'
    showExceptions = true
    showStackTraces = true
    showFullStackTraces = false
    showCauses = true
    slowThreshold = 5000
    showSummary = true
    showSimpleNames = false
    showPassed = true
    showSkipped = true
    showFailed = true
    showStandardStreams = false
    showPassedStandardStreams = true
    showSkippedStandardStreams = true
    showFailedStandardStreams = true
}
